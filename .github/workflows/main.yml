name: Build Huawei Y3 CRO-U00 zImage (Fixed Architecture)

on:
  workflow_dispatch:
  push:
    branches: [ main, master, los-14.1 ]

jobs:
  build-kernel:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Device Tree Configs
        uses: actions/checkout@v4

      - name: Generate Clean Compilation Script
        run: |
          cat << 'EOF' > run_build.sh
          #!/bin/bash
          set -e  # Stop the script immediately if any command fails

          echo '==================================================='
          echo 'STEP 1: Installing Vintage Dependencies'
          echo '==================================================='
          apt-get update
          apt-get install -y bc build-essential libncurses5-dev libssl-dev flex bison libelf-dev libxml2-utils lzma xz-utils git

          echo '==================================================='
          echo 'STEP 2: Cloning the ACTUAL Kernel Source Repository'
          echo '==================================================='
          git clone --depth=1 https://github.com /workspace/source

          echo '==================================================='
          echo 'STEP 3: Cloning Correct Legacy Toolchain'
          echo '==================================================='
          git clone --depth=1 https://googlesource.com /workspace/toolchain

          echo '==================================================='
          echo 'STEP 4: Compiling inside the Kernel directory'
          echo '==================================================='
          cd /workspace/source
          
          export ARCH=arm
          export CROSS_COMPILE=/workspace/toolchain/bin/arm-linux-androideabi-

          if [ -f arch/arm/configs/cairo_defconfig ]; then
            make cairo_defconfig
          elif [ -f arch/arm/configs/cro_u00_defconfig ]; then
            make cro_u00_defconfig
          else
            make mt6580_defconfig
          fi

          make -j$(nproc) zImage
          EOF
          chmod +x run_build.sh

      - name: Execute Build Inside Vintage Environment
        run: |
          # We map the newly made run_build.sh script file into the container and execute it cleanly
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -w /workspace \
            ubuntu:16.04 \
            ./run_build.sh

      - name: Upload Finished zImage
        uses: actions/upload-artifact@v4
        with:
          name: CRO-U00-zImage
          path: source/arch/arm/boot/zImage
