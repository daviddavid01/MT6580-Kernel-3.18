name: Build MT6580 LineageOS Kernel Online

on:
  workflow_dispatch:

env:
  ARCH: arm
  SUBARCH: arm
  CROSS_COMPILE: arm-linux-gnueabi-

jobs:
  build:
    runs-on: ubuntu-22.04
    
    # Run everything inside a 2016-era container environment
    container:
      image: ubuntu:16.04
      options: --user root

    steps:
    - name: Checkout Kernel Source Tree
      uses: actions/checkout@v4

    - name: Install Historical Compilers and Tools
      run: |
        # Update the older container's package lists safely
        apt-get update
        
        # Install the exact software and dependencies needed for 3.18 kernel compilation
        apt-get install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git ccache           gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf u-boot-tools lib32z1

    - name: Configure Target Architecture Profile
      run: |
        # Clear previous configurations
        make clean || true
        make mrproper || true
        
        # Load your target hardware profile blueprint
        if [ -f "arch/arm/configs/rainbow_defconfig" ]; then
          make rainbow_defconfig
        elif [ -f "arch/arm/configs/p4200_debug_defconfig" ]; then
          make p4200_debug_defconfig
        elif [ -f "arch/arm/configs/cro_u00_defconfig" ] || [ -f "arch/arm/configs/huawei_y3_defconfig" ]; then
          make *cro*defconfig || make *y3*defconfig
        else
          echo "Falling back to generic MediaTek base configuration..."
          make mt6580_defconfig
        fi

    - name: Compile Kernel zImage
      run: |
        # Build natively using the era-accurate compiler setup
        make -j$(nproc) zImage

    - name: Upload Compiled Deliverable
      uses: actions/upload-artifact@v4
      with:
        name: MT6580-Legacy-zImage
        path: arch/arm/boot/zImage
