name: Build MT6580 Huawei Y3 / Cubot Rainbow Kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: ubuntu:20.04
      options: --user root

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Set up Environment Minimal Dependencies
      run: |
        apt-get update
        apt-get install -y sudo software-properties-common tzdata gnupg2

    - name: Clean Workspace
      run: |
        rm -rf *.tar.gz *.tgz toolchain/ toolchains/ tc/
        make clean || true
        make mrproper || true

    - name: Install Dependencies and GCC-ARM Toolchain
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git ccache \
          lib32z1 lib32ncurses6 lib32stdc++6 u-boot-tools libncurses5:i386 \
          gcc-arm-linux-gnueabi gcc-arm-linux-gnueabihf

    - name: Configure and Compile Kernel
      run: |
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=arm-linux-gnueabi-
        
        # Suppress historic compiler strictness for clean 3.18 execution
        export HOSTCFLAGS="-O2 -fcommon"
        export CFLAGS="-O2 -fcommon -Wno-pointer-sign"
        
        echo "Searching for Cubot Rainbow or Huawei Y3 defconfig..."
        # Finds config filenames containing rainbow, cubot, or y3
        CONFIG_FILE=$(find arch/arm/configs/ -type f \( -name "*rainbow*" -o -name "*cubot*" -o -name "*y3*" \) -maxdepth 1 -print -quit | xargs basename 2>/dev/null)
        
        if [ -n "$CONFIG_FILE" ]; then
          echo "Found specific device configuration matching: $CONFIG_FILE"
          make "$CONFIG_FILE"
        else
          echo "WARNING: No custom device defconfig found. Attempting generic mt6580 baseline."
          make mt6580_defconfig || make rainbow_defconfig
        fi
        
        # Compile the zImage target using maximum processing cores
        make -j$(nproc) zImage

    - name: Upload Compiled zImage
      uses: actions/upload-artifact@v4
      with:
        name: Y3-Rainbow-zImage
        path: arch/arm/boot/zImage
