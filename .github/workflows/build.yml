name: Cloud Kernel Compiler

on:
  workflow_dispatch: # Allows manual run trigger

jobs:
  build-kernel:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        # Enable 32-bit library support explicitly
        sudo dpkg --add-architecture i386
        sudo apt-get update
        
        # Installs system build utilities along with modern 32-bit ncurses compatibility options
        sudo apt-get install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git ccache \
          lib32z1 lib32ncurses6 lib32stdc++6 libncurses6:i386

    - name: Download 32-bit Toolchain
      run: |
        # Download verified prebuilt toolchain archive directly to avoid git cloning connection failures
        wget https://googlesource.com -O toolchain.tar.gz
        mkdir legacy-gcc
        tar -xzf toolchain.tar.gz -C legacy-gcc
        rm toolchain.tar.gz

    - name: Compile zImage
      run: |
        export ARCH=arm
        export CROSS_COMPILE=$(pwd)/legacy-gcc/bin/arm-linux-androideabi-
        
        # Override old C language standard constraints to bypass strict modern error flags
        export KCFLAGS="-Wno-error -w -std=gnu89"
        
        # Clean build workspace trees
        make clean
        make mrproper
        
        # Try loading rainbow_defconfig; falls back to v3702_defconfig if name layout varies
        make rainbow_defconfig || make v3702_defconfig
        
        # Generate the zImage binary target payload
        make -j$(nproc) zImage

    - name: Upload Compiled File
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-MT6580-Kernel
        path: arch/arm/boot/zImage
