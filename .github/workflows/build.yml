name: Cloud Kernel Compiler

on:
  workflow_dispatch: # Allows you to start the build manually with one click

jobs:
  build-kernel:
    runs-on: ubuntu-20.04
    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Install Compiler Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git ccache

    - name: Download 32-bit Toolchain
      run: |
        # Clones the authentic Google Android GCC 4.9 toolchain required for older 3.18 kernels
        git clone https://googlesource.com legacy-gcc --depth=1

    - name: Compile zImage
      run: |
        export ARCH=arm
        export CROSS_COMPILE=$(pwd)/legacy-gcc/bin/arm-linux-androideabi-
        
        # Cleans previous configurations
        make clean
        make mrproper
        
        # Uses your exact repository profile configuration file
        make v3702_defconfig
        
        # Explicitly targets zImage using all available CPU threads
        make -j$(nproc) zImage

    - name: Upload Compiled File
      uses: actions/upload-artifact@v4
      with:
        name: Compiled-MT6580-Kernel
        path: arch/arm/boot/zImage
