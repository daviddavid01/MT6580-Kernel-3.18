name: Build MT6580 Kernel Online

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Kernel Source
      uses: actions/checkout@v4

    - name: Install Native Build Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y build-essential libncurses5-dev bison flex libssl-dev libelf-dev bc git ccache \
          lib32z1 lib32ncurses6 lib32stdc++6 libncurses6:i386 u-boot-tools

    - name: Clone Official Android GCC 4.9 Toolchain
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchains
        cd $GITHUB_WORKSPACE/toolchains
        # Clones the authentic Google prebuilt binary tree specifically for 32-bit ARM Android targets
        git clone --depth=1 https://googlesource.com legacy-gcc-4.9

    - name: Configure and Compile Kernel
      run: |
        # Set absolute path variables for compilation mapping
        export ARCH=arm
        export SUBARCH=arm
        export CROSS_COMPILE=$GITHUB_WORKSPACE/toolchains/legacy-gcc-4.9/bin/arm-linux-androideabi-
        
        # Clean build paths to avoid configuration conflicts
        make clean && make mrproper
        
        # Generate target defconfig (matching your Wiko Lenny 3 configuration tree)
        make lenny3_defconfig
        
        # Build the compressed zImage binary using all available cloud CPU cores
        make -j$(nproc) zImage

    - name: Upload Compiled zImage
      uses: actions/upload-artifact@v4
      with:
        name: MT6580-zImage
        path: arch/arm/boot/zImage
